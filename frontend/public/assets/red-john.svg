<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Red John smiley — stylised dripping circle face -->
  <!-- Outer circle stroke — slightly broken/brushstroke feel -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#CC1A1A" stroke-width="10" stroke-dasharray="520 40" stroke-dashoffset="30" stroke-linecap="round"/>
  <!-- Left eye drip -->
  <ellipse cx="70" cy="82" rx="8" ry="10" fill="#CC1A1A"/>
  <rect x="66" y="90" width="8" height="18" rx="4" fill="#CC1A1A"/>
  <!-- Right eye drip -->
  <ellipse cx="130" cy="82" rx="8" ry="10" fill="#CC1A1A"/>
  <rect x="126" y="90" width="8" height="14" rx="4" fill="#CC1A1A"/>
  <!-- Smile arc -->
  <path d="M 58 118 Q 100 158 142 118" fill="#CC1A1A" stroke="#CC1A1A" stroke-width="2"/>
  <!-- Smile drip center -->
  <rect x="97" y="140" width="7" height="20" rx="3.5" fill="#CC1A1A"/>
</svg>
